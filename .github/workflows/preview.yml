name: Preview

# Every pull request gets its own Worker (uncle-chess-pr-<number>), with its own
# Durable Objects, so games played on a preview never touch production.
# It is updated on every push and deleted when the pull request is closed.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WORKER_NAME: uncle-chess-pr-${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy preview
    # Pull requests from forks get no secrets.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - id: deploy
        shell: bash
        run: |
          yarn wrangler deploy --name "$WORKER_NAME" | tee deploy.log
          url=$(grep -oE "https://$WORKER_NAME\.[a-z0-9-]+\.workers\.dev" deploy.log | head -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The URL never changes for a given pull request: comment once.
      - name: Comment the preview URL
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🔎 **Aperçu de cette PR** : $URL

          Mis à jour à chaque push, supprimé à la fermeture de la PR. Les parties jouées ici sont séparées de la prod."

  cleanup:
    name: Delete preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # --force skips the confirmation prompt and also deletes the Worker's Durable Objects.
      - run: yarn wrangler delete "$WORKER_NAME" --force
